services:
  people:
    image: dashboardma-people:${PEOPLE_RELEASE:?Pin a reviewed full commit}
    container_name: dashboardma-people
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    env_file:
      - ${PEOPLE_SESSION_ENV:?Private SESSION_SECRET only file}
    environment:
      PEOPLE_HOST: 0.0.0.0
      PEOPLE_PORT: '4195'
      PEOPLE_PUBLIC_ORIGIN: https://iamobilityappsinc.com
    volumes:
      - people-data:/app/data
      - ${PEOPLE_ROLES_FILE:?Private current roles}:/run/people/roles.json:ro
      - ${PEOPLE_SOURCE_DIR:?Sanitized Azure snapshot directory}:/run/people/source:ro
    tmpfs: ['/tmp:rw,noexec,nosuid,size=8m']
    networks: [coolify]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: coolify
      traefik.http.routers.dashboardma-people.rule: Host(`iamobilityappsinc.com`) && (Path(`/dashboard/people`) || PathPrefix(`/dashboard/people/`))
      traefik.http.routers.dashboardma-people.entrypoints: https
      traefik.http.routers.dashboardma-people.tls: 'true'
      traefik.http.routers.dashboardma-people.tls.certresolver: letsencrypt
      traefik.http.routers.dashboardma-people.priority: '13000'
      traefik.http.routers.dashboardma-people.service: dashboardma-people
      traefik.http.services.dashboardma-people.loadbalancer.server.port: '4195'
volumes:
  people-data:
    name: dashboardma-people-data
networks:
  coolify:
    external: true
