name: dashboardma-onboarding-v2
services:
  onboarding-v2:
    build:
      context: ..
      dockerfile: Dockerfile.onboarding-v2
    image: dashboardma-onboarding-v2:${V2_RELEASE:-candidate}
    container_name: dashboardma-onboarding-v2
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${V2_SSO_ENV_FILE:?Set V2_SSO_ENV_FILE to the private runtime env file}
    environment:
      NODE_ENV: production
      V2_AUTH_MODE: sso
      V2_PORT: '4191'
      V2_LISTEN_HOST: 0.0.0.0
      V2_BASE_PATH: /dashboard/onboarding-v2
      V2_PUBLIC_ORIGIN: https://iamobilityappsinc.com
      V2_DATA_FILE: /app/data/onboarding-v2/state.json
      V2_IDENTITY_ROLES_FILE: /run/v2/roles.json
    volumes:
      - onboarding-v2-data:/app/data
      - ${V2_ROLES_FILE:?Set V2_ROLES_FILE to the explicit RBAC file}:/run/v2/roles.json:ro
    networks:
      - coolify
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4191/dashboard/onboarding-v2/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: 'true'
      traefik.docker.network: coolify
      traefik.http.routers.dashboardma-onboarding-v2.rule: 'Host(`iamobilityappsinc.com`) && (Path(`/dashboard/onboarding-v2`) || PathPrefix(`/dashboard/onboarding-v2/`))'
      traefik.http.routers.dashboardma-onboarding-v2.priority: '11000'
      traefik.http.routers.dashboardma-onboarding-v2.entrypoints: https
      traefik.http.routers.dashboardma-onboarding-v2.tls: 'true'
      traefik.http.routers.dashboardma-onboarding-v2.tls.certresolver: letsencrypt
      traefik.http.routers.dashboardma-onboarding-v2.service: dashboardma-onboarding-v2
      traefik.http.services.dashboardma-onboarding-v2.loadbalancer.server.port: '4191'
networks:
  coolify:
    external: true
volumes:
  onboarding-v2-data:
