server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    location = /health.txt {
        try_files /health.txt =404;
    }

    location = /dashboard {
        try_files /dashboard/index.html =404;
    }

    location /dashboard/ {
        try_files $uri $uri/ /dashboard/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
